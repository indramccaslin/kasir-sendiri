name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform files
        run: flutter create . --platforms=android --project-name kasir_sendiri

      - name: Set compileSdk
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle.kts
            sed -i -E 's/ndkVersion = .*/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
            grep -n "compileSdk\|ndkVersion" android/app/build.gradle.kts
          else
            sed -i -E 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
            sed -i -E 's/compileSdk .*/compileSdk 35/' android/app/build.gradle
            grep -n "compileSdk" android/app/build.gradle
          fi

      - name: Set app label
        run: sed -i 's/android:label="[^"]*"/android:label="PULSA PPOB VOUCHER"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kasir-sendiri-apk
          path: build/app/outputs/flutter-apk/app-release.apk
